<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="carbonCore" x1="36" y1="32" x2="92" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="neonNode" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Outer Hexagonal Carbon Lattice Orbit (12% safe margin) -->
  <polygon
    points="64,16 105.6,40 105.6,88 64,112 22.4,88 22.4,40"
    stroke="#64748B"
    stroke-opacity="0.55"
    stroke-width="3"
    stroke-dasharray="6 5"
  />

  <!-- Command Links from Carbon Core to 3 Neon Workers -->
  <line x1="64" y1="64" x2="64" y2="20" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="102" y2="86" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="26" y2="86" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Central Carbon Commander Hexagon -->
  <polygon
    points="64,41 84,52.5 84,75.5 64,87 44,75.5 44,52.5"
    fill="url(#carbonCore)"
    stroke="#F8FAFC"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <text x="64" y="70" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18">C</text>

  <!-- Three Orbiting Neon Worker Nodes -->
  <circle cx="64" cy="20" r="10" fill="url(#neonNode)" stroke="#F8FAFC" stroke-width="2.5"/>
  <circle cx="102" cy="86" r="10" fill="url(#neonNode)" stroke="#F8FAFC" stroke-width="2.5"/>
  <circle cx="26" cy="86" r="10" fill="url(#neonNode)" stroke="#F8FAFC" stroke-width="2.5"/>
</svg>
